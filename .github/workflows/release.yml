name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test application
        run: go test ./...

      - name: Vet application
        run: go vet ./...

      - name: Build application with UTF-8 installer source
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $config = Get-Content mygo.json -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match mygo.json version $expectedTag"
          }

          $releaseDir = Join-Path $PWD 'out\fnmovie-20261007\windows-amd64'
          $installer = Join-Path $releaseDir "mou-li-ying-yuan-setup-$($config.version)-amd64.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MyGo did not produce the expected Windows installer: $installer"
          }
          foreach ($required in @('哞哩影院.exe', 'icon.png', 'THIRD-PARTY-NOTICES.md', 'licenses', 'player\libmpv-2.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $required))) {
              throw "Required Windows release file is missing: $required"
            }
          }

          $portableZip = Join-Path $releaseDir "哞哩影院-$($config.version)-windows-amd64-portable.zip"
          Compress-Archive -Path @(
            (Join-Path $releaseDir '哞哩影院.exe'),
            (Join-Path $releaseDir 'icon.png'),
            (Join-Path $releaseDir 'THIRD-PARTY-NOTICES.md'),
            (Join-Path $releaseDir 'licenses'),
            (Join-Path $releaseDir 'player')
          ) -DestinationPath $portableZip -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: 哞哩影院-windows-amd64
          path: |
            out/fnmovie-20261007/windows-amd64/mou-li-ying-yuan-setup-*-amd64.exe
            out/fnmovie-20261007/windows-amd64/哞哩影院-*-windows-amd64-portable.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libmpv build assets
        run: brew install mpv

      - name: Vet application
        run: go vet ./...

      - name: Build and verify disk image
        run: bash scripts/build-macos.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: 哞哩影院-macos-arm64
          path: out/fnmovie-macos/darwin-arm64/*-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 哞哩影院 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
