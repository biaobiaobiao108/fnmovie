name: Release Windows x64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test application
        run: go test ./...

      - name: Vet application
        run: go vet ./...

      - name: Build application with UTF-8 installer source
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $config = Get-Content mygo.json -Raw -Encoding utf8 | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match mygo.json version $expectedTag"
          }

          $releaseDir = Join-Path $PWD 'out\fnmovie-20261007\windows-amd64'
          $installer = Join-Path $releaseDir "哞哩影院 Setup $($config.version).exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MyGo did not produce the expected Windows installer: $installer"
          }
          foreach ($required in @('哞哩影院.exe', 'icon.png', 'THIRD-PARTY-NOTICES.md', 'licenses', 'player\libmpv-2.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $required))) {
              throw "Required Windows release file is missing: $required"
            }
          }

          $portableZip = Join-Path $releaseDir "哞哩影院-$($config.version)-windows-amd64-portable.zip"
          Compress-Archive -Path @(
            (Join-Path $releaseDir '哞哩影院.exe'),
            (Join-Path $releaseDir 'icon.png'),
            (Join-Path $releaseDir 'THIRD-PARTY-NOTICES.md'),
            (Join-Path $releaseDir 'licenses'),
            (Join-Path $releaseDir 'player')
          ) -DestinationPath $portableZip -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: 哞哩影院-windows-amd64
          path: |
            out/fnmovie-20261007/windows-amd64/哞哩影院 Setup *.exe
            out/fnmovie-20261007/windows-amd64/哞哩影院-*-windows-amd64-portable.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 哞哩影院 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
