name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-vet:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test application
        run: go test ./...

      - name: Vet application
        run: go vet ./...
